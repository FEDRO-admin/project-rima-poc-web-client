<div class="history-picker">
  @if (historyStore.active()) {
    <calcite-button appearance="solid" kind="danger" icon-start="reset" width="full" (click)="returnToPresent()"
      >Return to Present</calcite-button
    >
    <span class="active-date">Viewing: {{ historyStore.selectedDate() | date: 'dd.MM.yyyy' }}</span>
  }
  <calcite-dropdown width-scale="m">
    <calcite-button
      slot="trigger"
      appearance="outline"
      kind="neutral"
      icon-start="clock"
      icon-end="chevron-down"
      width="full"
      >Historical Moments</calcite-button
    >
    <calcite-dropdown-group selection-mode="single">
      @for (moment of moments; track moment.name) {
        <calcite-dropdown-item
          [attr.selected]="isSelected(moment) ? '' : null"
          (calciteDropdownItemSelect)="selectMoment(moment)"
        >
          {{ moment.name }} ({{ moment.date | date: 'dd.MM.yyyy' }})
        </calcite-dropdown-item>
      }
    </calcite-dropdown-group>
  </calcite-dropdown>
</div>
