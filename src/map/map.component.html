<div class="map-container">
  <rima-popup></rima-popup>
  <div class="map-area">
    <arcgis-map
      id="rima-map"
      #arcgisMap
      [extent]="switzerlandExtent"
      [class.visually-hidden]="viewStore.mode() === 'scene'"
    ></arcgis-map>
    <arcgis-scene #arcgisScene viewing-mode="local" [class.visually-hidden]="viewStore.mode() === 'map'"></arcgis-scene>
    <rima-scene-toggle />
    <rima-history-picker />
  </div>
  <rima-toc></rima-toc>
</div>
