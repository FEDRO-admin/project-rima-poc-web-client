<div class="popup-content">
  <h3 class="popup-title">{{ title() }}</h3>
  <div class="popup-tabs">
    <button
      class="popup-tab"
      [class.popup-tab--active]="activeTab() === 'attributes'"
      (click)="selectTab('attributes')"
    >
      Attributes
    </button>
    <button class="popup-tab" [class.popup-tab--active]="activeTab() === 'reference'" (click)="selectTab('reference')">
      Reference
    </button>
    <button class="popup-tab" [class.popup-tab--active]="activeTab() === 'hierarchy'" (click)="selectTab('hierarchy')">
      Hierarchy
    </button>
    <button class="popup-tab" [class.popup-tab--active]="activeTab() === 'documents'" (click)="selectTab('documents')">
      Documents
    </button>
  </div>

  @switch (activeTab()) {
    @case ('attributes') {
      <div class="popup-panel">
        <rima-attributes-tab [graphic]="graphic()" />
      </div>
    }
    @case ('reference') {
      <div class="popup-panel">
        <rima-reference-point
          #vonRef
          mode="edit"
          type="von"
          [graphic]="graphic()"
          [disabled]="refSaving()"
          (pendingChangesChange)="onVonPendingChange($event)"
        />
        <rima-reference-point
          #bisRef
          mode="edit"
          type="bis"
          [graphic]="graphic()"
          [disabled]="refSaving()"
          (pendingChangesChange)="onBisPendingChange($event)"
        />
        @if (refPendingChanges()) {
          <div class="popup-panel-actions">
            <button class="popup-save-btn" (click)="saveReferencePoints()" [disabled]="refSaving()">
              @if (refSaving()) {
                Saving...
              } @else {
                Save Reference Points
              }
            </button>
          </div>
        }
      </div>
    }
    @case ('hierarchy') {
      <div class="popup-panel">
        <rima-hierarchy-tab [graphic]="graphic()" />
      </div>
    }
    @case ('documents') {
      <div class="popup-panel">
        <rima-documents-tab [graphic]="graphic()" />
      </div>
    }
  }
</div>
