<div class="popup-content">
  <h3 class="popup-title">{{ title() }}</h3>

  @switch (activeTab()) {
    @case ('attributes') {
      <div class="popup-panel">
        <rima-attributes-tab [graphic]="graphic()" />
      </div>
    }
    @case ('reference') {
      <div class="popup-panel">
        <rima-reference-point
          #vonRef
          mode="edit"
          type="von"
          [graphic]="graphic()"
          [disabled]="refSaving()"
          (pendingChangesChange)="onVonPendingChange($event)"
        />
        <rima-reference-point
          #bisRef
          mode="edit"
          type="bis"
          [graphic]="graphic()"
          [disabled]="refSaving()"
          (pendingChangesChange)="onBisPendingChange($event)"
        />
        @if (refPendingChanges()) {
          <div class="popup-panel-actions">
            <button class="popup-save-btn" (click)="saveReferencePoints()" [disabled]="refSaving()">
              @if (refSaving()) {
                Saving...
              } @else {
                Save Reference Points
              }
            </button>
          </div>
        }
      </div>
    }
    @case ('status') {
      <div class="popup-panel">
        <rima-status [graphic]="graphic()" />
      </div>
    }
    @case ('hierarchy') {
      <div class="popup-panel">
        <rima-hierarchy-tab [graphic]="graphic()" />
      </div>
    }
    @case ('documents') {
      <div class="popup-panel">
        <rima-documents-tab [graphic]="graphic()" />
      </div>
    }
  }
</div>
