<ng-container *transloco="let t">
  <button
    class="basemap-toggle"
    (click)="toggle()"
    [attr.aria-label]="open() ? t('basemap-gallery.close') : t('basemap-gallery.open')"
    [class.active]="open()"
  >
    <calcite-icon icon="basemap" scale="s"></calcite-icon>
  </button>

  @if (open()) {
    <div class="basemap-panel">
      <arcgis-basemap-gallery #gallery></arcgis-basemap-gallery>
    </div>
  }
</ng-container>
